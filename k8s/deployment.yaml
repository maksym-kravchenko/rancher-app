apiVersion: apps/v1
kind: Deployment
metadata:
  name: rancher-app
  namespace: rancher-app
  labels:
    app: rancher-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rancher-app
  template:
    metadata:
      labels:
        app: rancher-app
    spec:
      containers:
        - name: app
          image: ghcr.io/maksym-kravchenko/rancher-app:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: APP_VERSION_OVERRIDE
              value: ""
          envFrom:
            - configMapRef:
                name: rancher-app-config
            - secretRef:
                name: rancher-app-secret
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2