apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

configMapGenerator:
  - name: rancher-app-red
    files:
      - rancher-app-red.json
  - name: rancher-app-runtime
    files:
      - rancher-app-runtime.json

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
